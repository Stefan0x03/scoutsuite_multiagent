# ScoutSuite Batch Scanner — Example Credentials File
#
# Copy this file to credentials.yaml and fill in real values.
# credentials.yaml is gitignored and should NEVER be committed.
#
# Each entry under `scans` defines one ScoutSuite run.
# Scans are executed in the order listed.

scans:

  # -------------------------------------------------------------------------
  # AWS — access keys (IAM user or temporary STS credentials)
  # -------------------------------------------------------------------------
  - name: aws-prod
    provider: aws
    auth:
      type: access_keys
      access_key_id: AKIAIOSFODNN7EXAMPLE
      secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      # session_token is optional; include it for temporary STS credentials
      # session_token: AQoXnyc4piapi...

  # -------------------------------------------------------------------------
  # AWS — named profile from ~/.aws/credentials
  # -------------------------------------------------------------------------
  - name: aws-staging
    provider: aws
    auth:
      type: profile
      profile_name: my-staging-profile

  # -------------------------------------------------------------------------
  # AWS — assume an IAM role (via source profile)
  # -------------------------------------------------------------------------
  - name: aws-audit-role
    provider: aws
    auth:
      type: role
      role_arn: arn:aws:iam::123456789012:role/AuditRole
      source_profile: default          # profile that has permission to assume the role
      # external_id: optional-external-id

  # -------------------------------------------------------------------------
  # Azure — service principal (app registration)
  # -------------------------------------------------------------------------
  - name: azure-corp
    provider: azure
    auth:
      type: service_principal
      tenant_id: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
      subscription_id: yyyyyyyy-yyyy-yyyy-yyyy-yyyyyyyyyyyy
      client_id: zzzzzzzz-zzzz-zzzz-zzzz-zzzzzzzzzzzz
      client_secret: your-client-secret-here

  # -------------------------------------------------------------------------
  # Azure — use existing Azure CLI session (az login)
  # -------------------------------------------------------------------------
  - name: azure-cli-session
    provider: azure
    auth:
      type: cli
      # subscription_id is optional; omit to scan all accessible subscriptions
      subscription_id: yyyyyyyy-yyyy-yyyy-yyyy-yyyyyyyyyyyy

  # -------------------------------------------------------------------------
  # GCP — service account key file
  # -------------------------------------------------------------------------
  - name: gcp-production
    provider: gcp
    auth:
      type: service_account
      key_file: /path/to/service-account-key.json
      project_id: my-gcp-project       # optional; scans all projects if omitted

  # -------------------------------------------------------------------------
  # GCP — application default credentials (gcloud auth application-default login)
  # -------------------------------------------------------------------------
  - name: gcp-dev
    provider: gcp
    auth:
      type: user_account
      project_id: my-dev-project       # optional
